uk_property:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/warehouse.duckdb') }}"
      schema: analytics
      threads: 4
    bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'uk-property-pipeline') }}"
      dataset: analytics
      location: europe-west2
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 600
